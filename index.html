<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VitaPass</title>
    <meta name="theme-color" content="#060B16" />
    <meta name="description" content="VitaPass — votre dossier médical d'urgence, toujours avec vous." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      html,body{background:#060B16;margin:0}
      /* Écran d'ouverture : le logo apparaît en premier */
      #vp-intro{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:radial-gradient(60% 45% at 50% 45%,rgba(0,201,141,.16),transparent 70%),#060B16;transition:opacity .45s ease,visibility .45s;cursor:pointer;
        font-family:'Syne','Inter',system-ui,sans-serif}
      #vp-intro.out{opacity:0;visibility:hidden}
      #vp-intro .ring{width:112px;height:112px;position:relative}
      #vp-intro svg{width:112px;height:112px;overflow:visible}
      #vp-intro .c1{stroke:#00C98D;stroke-width:1.6;fill:none;stroke-dasharray:330;stroke-dashoffset:330;animation:vpDraw 1s cubic-bezier(.65,0,.35,1) .1s forwards;opacity:.7}
      #vp-intro .c2{fill:#0A1628;opacity:0;animation:vpIn .5s ease .35s forwards}
      #vp-intro .hrt{opacity:0;transform-origin:55px 60px;transform:scale(.6);animation:vpHeart .6s cubic-bezier(.2,1.4,.4,1) .55s forwards,vpBeat 1.3s ease-in-out 1.2s infinite}
      #vp-intro .glow{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(0,201,141,.28),transparent 65%);opacity:0;animation:vpIn .8s ease .6s forwards}
      #vp-intro .name{font-size:34px;font-weight:800;color:#F2F5FC;letter-spacing:-.5px;opacity:0;transform:translateY(8px);animation:vpUp .55s ease .75s forwards}
      #vp-intro .name span{color:#00C98D}
      #vp-intro .tag{font-family:'Inter',system-ui,sans-serif;font-size:14px;color:#8C98B3;opacity:0;transform:translateY(8px);animation:vpUp .55s ease .9s forwards}
      @keyframes vpDraw{to{stroke-dashoffset:0}}
      @keyframes vpIn{to{opacity:1}}
      @keyframes vpHeart{to{opacity:1;transform:scale(1)}}
      @keyframes vpBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
      @keyframes vpUp{to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#vp-intro *{animation-duration:.01s!important;animation-delay:0s!important}}
    </style>
  </head>
  <body>
    <div id="vp-intro" aria-hidden="true">
      <div class="ring">
        <div class="glow"></div>
        <svg viewBox="0 0 110 110">
          <circle class="c1" cx="55" cy="55" r="52" transform="rotate(-90 55 55)" />
          <circle class="c2" cx="55" cy="55" r="44" />
          <path class="hrt" d="M55 82C48 76 30 66 30 51c0-8 6-14 13-14 4.5 0 8.5 2.5 12 6.5 3.5-4 7.5-6.5 12-6.5 7 0 13 6 13 14 0 15-17 25-25 31Z" fill="url(#vpig)" />
          <defs><linearGradient id="vpig" x1="30" y1="37" x2="80" y2="82" gradientUnits="userSpaceOnUse"><stop stop-color="#00E09E"/><stop offset="1" stop-color="#00805A"/></linearGradient></defs>
        </svg>
      </div>
      <div class="name">Vita<span>Pass</span></div>
      <div class="tag">Votre santé, toujours avec vous</div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('vp-intro')
        var p = location.pathname
        var seen = false
        try { seen = sessionStorage.getItem('vp-intro') === '1' } catch (e) {}
        // Jamais d'attente sur la page d'urgence (secouristes), ni au retour de connexion
        if (seen || /^\/(urgence|privacy|auth)/.test(p) || /type=recovery/.test(location.hash)) { el.remove(); return }
        try { sessionStorage.setItem('vp-intro', '1') } catch (e) {}
        try { if (localStorage.getItem('vitapass_lang') === 'ar') el.querySelector('.tag').textContent = 'صحتك معك دائماً' } catch (e) {}
        var done = false
        function hide() { if (done) return; done = true; el.classList.add('out'); setTimeout(function () { el.remove() }, 500) }
        el.addEventListener('click', hide)
        setTimeout(hide, 1900)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
